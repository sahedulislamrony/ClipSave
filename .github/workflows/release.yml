name: Release

# Push a tag like v1.0.0 to build signed APKs and publish them as a GitHub Release.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 -i keystore/clipsave-release.jks | pbcopy
#   KEYSTORE_PASSWORD  storePassword (= keyPassword) from keystore.properties
#   KEY_ALIAS          keyAlias from keystore.properties (clipsave)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is not set"; exit 1; }
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/clipsave-release.jks
          {
            echo "storeFile=keystore/clipsave-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build signed APKs
        run: ./build.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" outputs/ClipSave-*.apk outputs/SHA256SUMS.txt \
            --title "ClipSave ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Keep APKs from manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: clipsave-apks
          path: outputs/
