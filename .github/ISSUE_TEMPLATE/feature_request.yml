name: Feature request
description: Suggest an idea for ClipSave
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ClipSave stays small and private: no ads, analytics or trackers, and few permissions.
        Ideas that fit that are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
